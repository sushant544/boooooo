<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>Sky Today</title>
	<style>
		@import url('https://fonts.googleapis.com/css2?family=DM+Mono&family=Space+Grotesk:wght@400;600;700&display=swap');
		:root{--ink:#17251f;--muted:#718079;--paper:#f8f7f1;--blue:#b8e0e7;--yellow:#f4d66b;--line:#d9e0d7}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(135deg,#dcebe5,#f3e8d1);color:var(--ink);font-family:'Space Grotesk',sans-serif}.app{width:min(1050px,100%);min-height:100vh;margin:auto;padding:clamp(22px,6vw,70px);background:var(--paper)}header{display:flex;justify-content:space-between;margin-bottom:90px}.brand{font-weight:700;font-size:21px;letter-spacing:-.06em}.mark{display:inline-grid;place-items:center;width:30px;height:30px;margin-right:9px;border:2px solid var(--ink);border-radius:50%;background:var(--yellow)}.stamp,.meta,.status,.label{font:11px 'DM Mono',monospace;color:var(--muted)}.stamp{text-align:right;line-height:1.5}.hero{max-width:720px;margin:auto}.label{margin:0 0 14px;color:#c65d45;letter-spacing:.12em;text-transform:uppercase}h1{margin:0;font-size:clamp(3.4rem,9vw,7.8rem);line-height:.84;letter-spacing:-.09em}.search{display:flex;max-width:590px;margin-top:32px;padding:7px;border:1px solid var(--ink);background:white;box-shadow:5px 5px var(--ink)}input{min-width:0;flex:1;padding:12px;border:0;outline:0;font:16px 'Space Grotesk',sans-serif}button{padding:0 17px;border:0;background:var(--ink);color:#fff;font-weight:600;cursor:pointer}.status{min-height:18px;margin:18px 0}.dashboard{display:none;margin-top:70px;animation:rise .4s ease both}.dashboard.show{display:block}@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:16px}.panel{border:1px solid var(--line);background:#ffffff99}.current{min-height:275px;padding:25px;background:linear-gradient(130deg,var(--blue),#edf1db)}.place{margin:0 0 8px;font-size:21px;font-weight:600}.big{display:flex;align-items:center;gap:18px;margin-top:53px}.icon{font-size:64px}.temp{font-size:clamp(4rem,9vw,7rem);line-height:.8;letter-spacing:-.1em}.condition{margin:20px 0 0;font-size:18px}.metrics{display:grid;grid-template-columns:1fr 1fr;padding:8px}.metric{min-height:126px;padding:18px;border-bottom:1px solid var(--line)}.metric:nth-child(odd){border-right:1px solid var(--line)}.metric:nth-last-child(-n+2){border-bottom:0}.metric b{display:block;margin-top:20px;font-size:23px}.section{margin-top:48px}.section h2{margin:0 0 14px;font-size:21px;letter-spacing:-.05em}.hours,.days{display:grid;overflow:hidden}.hours{grid-template-columns:repeat(8,1fr)}.days{grid-template-columns:repeat(5,1fr)}.hour,.day{padding:17px 12px;border-right:1px solid var(--line);background:#ffffff99}.hour{text-align:center}.hour:last-child,.day:last-child{border:0}.hour-icon{display:block;margin:17px 0;font-size:25px}.hour span,.day small{font:11px 'DM Mono',monospace}.day{display:flex;justify-content:space-between;gap:8px}.day strong{display:block;margin-bottom:8px}.day-icon{font-size:24px}.day-temp{font:12px 'DM Mono',monospace;text-align:right;line-height:1.8}.day-temp small{color:var(--muted)}footer{display:flex;justify-content:space-between;margin-top:55px;padding-top:18px;border-top:1px solid var(--line)}@media(max-width:700px){header{margin-bottom:55px}.stamp{display:none}.grid{grid-template-columns:1fr}.hours{grid-template-columns:repeat(4,1fr)}.hour:nth-child(n+5){border-top:1px solid var(--line)}.days{grid-template-columns:1fr}.day{border-right:0;border-bottom:1px solid var(--line)}footer{gap:14px;flex-direction:column}}
	</style>
</head>
<body>
	<main class="app">
		<header><div class="brand"><span class="mark">☼</span>sky today</div><div class="stamp">LIVE WEATHER<br>OPEN-METEO</div></header>
		<section class="hero"><p class="label">look outside, remotely</p><h1>How is the<br>sky feeling?</h1><form class="search" id="form"><input id="city" placeholder="Search a city, like Detroit" aria-label="City"><button>CHECK</button></form><p class="status" id="status">Try a city to see its forecast.</p></section>
		<section class="dashboard" id="dashboard"><div class="grid"><article class="panel current"><p class="place" id="place"></p><span class="meta" id="date"></span><div class="big"><span class="icon" id="icon"></span><span class="temp" id="temp"></span><span>°C</span></div><p class="condition" id="condition"></p></article><article class="panel metrics"><div class="metric"><span class="meta">feels like</span><b id="feels"></b></div><div class="metric"><span class="meta">wind</span><b id="wind"></b></div><div class="metric"><span class="meta">humidity</span><b id="humidity"></b></div><div class="metric"><span class="meta">rain now</span><b id="rain"></b></div></article></div><div class="section"><h2>Next 8 hours</h2><div class="panel hours" id="hours"></div></div><div class="section"><h2>Five day forecast</h2><div class="panel days" id="days"></div></div></section>
		<footer><span class="meta">sky today</span><span class="meta">forecast data by Open-Meteo</span></footer>
	</main>
	<script>
		const $=id=>document.getElementById(id), codes={0:['Clear sky','☀️'],1:['Mainly clear','🌤️'],2:['Partly cloudy','⛅'],3:['Overcast','☁️'],45:['Foggy','🌫️'],51:['Drizzle','🌦️'],53:['Drizzle','🌦️'],61:['Rain','🌧️'],63:['Rain','🌧️'],65:['Heavy rain','🌧️'],71:['Snow','🌨️'],73:['Snow','❄️'],75:['Heavy snow','❄️'],80:['Showers','🌦️'],81:['Showers','🌧️'],82:['Heavy showers','⛈️'],95:['Thunderstorm','⛈️'],96:['Storm','⛈️'],99:['Storm','⛈️']};
		const condition=code=>codes[code]||['Changing skies','🌤️'], date=(value,options)=>new Intl.DateTimeFormat(undefined,options).format(new Date(value));
		async function getWeather(city){
			let latitude=42.33,longitude=-83.05,name='Detroit, US';
			if(city){const geo=await fetch('https://geocoding-api.open-meteo.com/v1/search?name='+encodeURIComponent(city)+'&count=1&language=en&format=json');const result=await geo.json();if(!result.results?.length)throw Error('City not found. Try another name.');const place=result.results[0];latitude=place.latitude;longitude=place.longitude;name=place.name+', '+(place.country_code||place.country)}
			const url='https://api.open-meteo.com/v1/forecast?latitude='+latitude+'&longitude='+longitude+'&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m&hourly=temperature_2m,weather_code,precipitation_probability&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=6';
			const response=await fetch(url);if(!response.ok)throw Error('Weather service unavailable.');return {name,data:await response.json()};
		}
		function render(result){const d=result.data,c=d.current,[text,emoji]=condition(c.weather_code);$('place').textContent=result.name;$('date').textContent=date(c.time,{weekday:'long',month:'long',day:'numeric'});$('icon').textContent=emoji;$('temp').textContent=Math.round(c.temperature_2m);$('condition').textContent=text;$('feels').textContent=Math.round(c.apparent_temperature)+'°';$('wind').textContent=Math.round(c.wind_speed_10m)+' km/h';$('humidity').textContent=c.relative_humidity_2m+'%';$('rain').textContent=d.hourly.precipitation_probability[0]+'%';const start=d.hourly.time.findIndex(time=>time>=c.time);$('hours').innerHTML=d.hourly.time.slice(start,start+8).map((time,i)=>{const [label,icon]=condition(d.hourly.weather_code[start+i]);return '<div class="hour"><span>'+(i?' '+date(time,{hour:'numeric'}):'NOW')+'</span><span class="hour-icon">'+icon+'</span><span>'+Math.round(d.hourly.temperature_2m[start+i])+'°</span></div>'}).join('');$('days').innerHTML=d.daily.time.slice(1,6).map((time,i)=>{const n=i+1,[label,icon]=condition(d.daily.weather_code[n]);return '<div class="day"><div><strong>'+date(time,{weekday:'short'})+'</strong><small>'+date(time,{month:'short',day:'numeric'})+'</small></div><span class="day-icon">'+icon+'</span><span class="day-temp">'+Math.round(d.daily.temperature_2m_max[n])+'°<br><small>'+Math.round(d.daily.temperature_2m_min[n])+'°</small></span></div>'}).join('');$('dashboard').classList.add('show');$('dashboard').scrollIntoView({behavior:'smooth',block:'start'})}
		$('form').addEventListener('submit',async event=>{event.preventDefault();$('status').textContent='Fetching the latest forecast...';try{render(await getWeather($('city').value.trim()));$('status').textContent='Updated just now.'}catch(error){$('status').textContent=error.message}});
		getWeather('').then(render).catch(error=>{$('status').textContent=error.message});
	</script>
</body>
</html>
